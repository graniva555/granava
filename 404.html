<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Granava</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/granava-favicon.svg">
<link rel="icon" type="image/x-icon" href="/granava-favicon.ico">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=DM+Sans:wght@400;600&family=Josefin+Sans:wght@300&display=swap">
<style>
  :root{--bg:#07101e;--gold:#c9a96e;--text:#edf2f8;--muted:#6b7f96;--border:#162538;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  .navbar{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;}
  .logo{display:flex;flex-direction:column;gap:3px;text-decoration:none;}
  .logo b{font-family:'Josefin Sans',Arial,sans-serif;font-size:18px;font-weight:300;color:var(--gold);letter-spacing:.32em;text-transform:uppercase;line-height:1;}
  .logo small{font-family:'Josefin Sans',Arial,sans-serif;font-size:6px;letter-spacing:.3em;color:rgba(255,255,255,.5);text-transform:uppercase;}
  .wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;}
  .code{font-family:'Playfair Display',serif;font-size:5rem;font-weight:500;color:var(--gold);line-height:1;margin-bottom:8px;}
  h1{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:500;margin-bottom:12px;}
  p{color:var(--muted);font-size:15px;margin-bottom:28px;max-width:420px;line-height:1.7;}
  .links{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .btn{display:inline-block;padding:13px 26px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:6px;text-decoration:none;transition:opacity .18s;}
  .btn-gold{background:var(--gold);color:#07101e;}
  .btn-out{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn:hover{opacity:.85;}
</style>
</head>
<body>
<header class="navbar">
  <a href="/" class="logo" aria-label="Granava home"><b>GRANAVA</b><small>NATURAL GRANITE</small></a>
</header>
<div class="wrap">
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
  <div class="links">
    <a href="/" class="btn btn-gold">← Back to Home</a>
    <a href="/products/" class="btn btn-out">View Collection</a>
  </div>
</div>
</body>
</html>
